<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>HyperFileLens · Personal Subscription</title>
  <style>
.billing-panel {
  background: var(--bg);
  border: 0;
  border-radius: 0;
}

.billing-page {
  padding: 0 0 20px;
  min-width: 0;
  max-width: 1600px;
}

.billing-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 24px;
  border: 1px solid #e5e6ed;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 2px 8px #0f172a05;
}

.billing-card>header {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 24px;
}

.billing-card h3 {
  font-size: 14px;
  font-weight: 600;
}

.billing-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: #6d5ef614;
  color: var(--purple);
}

.billing-icon .icon {
  width: 17px;
  height: 17px;
}

.billing-state {
  display: inline-flex;
  padding: 2px var(--billing-state-padding-inline);
  font-size: 11px;
  font-weight: 500;
  line-height: 19px;
  border-radius: 5px;
  border: var(--billing-state-border-width) solid #bbe4d1;
  color: #137a4d;
  background: #f0faf5;
  white-space: nowrap;
}

.billing-card>header .billing-state {
  margin-left: auto;
}

.billing-state.neutral {
  color: #737984;
  background: #fafafd;
  border-color: #e5e6ed;
}

.billing-state.warning {
  color: #9b6408;
  background: #fff9ed;
  border-color: #f3dbab;
}

.billing-price {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.5;
  margin: 12px 0 21px;
  font-variant-numeric: tabular-nums;
}

.billing-price>span {
  font-size: 13px;
  font-weight: 400;
  color: #737984;
}

.billing-facts {
  display: grid;
  gap: 12px;
  margin: 0;
}

.billing-facts>div {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 13px;
  align-items: baseline;
}

.billing-facts dt {
  color: #737984;
}

.billing-facts dd {
  margin: 0;
  color: #303133;
  font-variant-numeric: tabular-nums;
}

.billing-card-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 23px;
  margin-top: auto;
}

.billing-notice {
  font-size: 12px;
  color: #795d25;
  line-height: 1.7;
  background: #fffaf0;
  border: 1px solid #f3e4c3;
  border-radius: 6px;
  padding: 10px 12px;
  margin-top: 16px;
}

.billing-notice strong {
  font-weight: 600;
}

.billing-history {
  border: 1px solid #e5e6ed;
  background: #fff;
  border-radius: 10px;
  margin-top: 24px;
  overflow: hidden;
}

.billing-history-heading {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.billing-history-heading h3 {
  font-size: 14px;
  font-weight: 600;
}

.billing-table-scroll {
  overflow: auto;
  min-width: 0;
}

.billing-history table {
  width: 100%;
  min-width: 750px;
  border-collapse: collapse;
  color: var(--ink);
  font-size: 12px;
}

.billing-history th,
.billing-history td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: middle;
}

.billing-history th {
  background: var(--bg);
  font-weight: 500;
  white-space: nowrap;
}

.billing-history th:first-child {
  width: 160px;
}

.billing-history th:nth-child(3) {
  width: 145px;
}

.billing-history th:nth-child(4) {
  width: 125px;
}

.billing-history th:last-child {
  width: 140px;
}

.billing-history td {
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.billing-history tbody tr:last-child td {
  border-bottom: 0;
}

.billing-history tbody tr:hover {
  background: #f4f2ff;
}

.billing-cycle-picker {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  width: fit-content;
  max-width: 100%;
  padding: 3px;
  background: #f4f3f8;
  border: 1px solid #e5e3ec;
  border-radius: 7px;
  margin: 0 auto 22px;
  gap: 4px;
}

.billing-cycle-picker>label {
  position: relative;
  display: grid;
  min-width: 0;
}

.billing-cycle-picker input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.billing-cycle-picker label>span {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 5px;
  font-size: 13px;
  line-height: 1.25;
  cursor: pointer;
  border: 1px solid transparent;
  min-height: 34px;
}

.billing-cycle-picker input:checked+span {
  background: #fff;
  color: var(--purple);
  border-color: #ded9fc;
  box-shadow: 0 1px 4px #3029630a;
}

.billing-cycle-picker input:focus-visible+span {
  outline: 2px solid var(--purple);
  outline-offset: 2px;
}

.billing-cycle-picker small {
  font-size: 10px;
  color: #137a4d;
}

.billing-error {
  color: #b42318;
  font-size: 12px;
  line-height: 1.7;
  margin-top: 10px;
}

.billing-error:empty {
  display: none;
}

.billing-summary {
  display: grid;
  gap: 15px;
  margin: 0;
}

.billing-summary>div {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 18px;
  font-size: 13px;
}

.billing-summary dt {
  color: #737984;
  flex-shrink: 0;
}

.billing-summary dd {
  margin: 0;
  text-align: right;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.billing-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@media (max-width:1100px) {
  .billing-card {
    padding: 20px;
  }

  .billing-card>header {
    flex-wrap: wrap;
  }

  .billing-card>header h3 {
    font-size: 13px;
  }

  .billing-card>header .billing-state {
    margin-left: 0;
  }

}

@media (max-width:850px) {
  .billing-card>header .billing-state {
    margin-left: auto;
  }

}

@media (max-width:700px) {
  .billing-card {
    padding: 16px;
  }

  .billing-card>header {
    gap: 8px;
    margin-bottom: 19px;
  }

  .billing-card>header .billing-state {
    margin-left: 0;
  }

  .billing-history-heading {
    padding: 14px 12px;
    gap: 8px;
  }

  .billing-history-heading h3 {
    width: 100%;
    margin-bottom: 4px;
  }

  .billing-history-heading .control {
    min-width: 0;
    max-width: 160px;
  }

  .billing-card-actions {
    flex-direction: column;
  }

  .billing-card-actions .btn {
    min-height: 36px;
  }

  .billing-summary>div {
    gap: 12px;
  }

  .billing-summary dt {
    flex-shrink: 1;
  }

  .billing-cycle-picker label>span {
    padding: 6px 10px;
    flex-wrap: wrap;
  }

  .billing-cycle-picker {
    margin-bottom: 18px;
  }

}

.bc-page-head {
  display: flex;
  gap: 12px;
  align-items: center;
  margin: 2px 0 22px;
}

.bc-page-head h2 {
  font-size: 18px;
  font-weight: 600;
}

.bc-page-head p {
  font-size: 13px;
  color: #737984;
  margin-top: 5px;
}

.bc-alert {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 17px 20px;
  background: #f4f2ff;
  border: 1px solid #e1dcfb;
  border-radius: 9px;
  margin-bottom: 18px;
  color: #5b5286;
}

.bc-alert>div {
  flex: 1;
}

.bc-alert strong {
  font-size: 13px;
  font-weight: 600;
}

.bc-alert p {
  font-size: 12px;
  line-height: 1.7;
  margin-top: 4px;
}

.bc-alert.danger {
  background: #fff4f2;
  border-color: #f5d4d0;
  color: #a64237;
}

.bc-alert.warning {
  background: #fffaee;
  border-color: #efdfb7;
  color: #87601e;
}

.bc-alert .btn {
  flex-shrink: 0;
}

.bc-order-banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  background: #fff;
  border: 1px solid #e5e6ed;
  border-radius: 8px;
  padding: 12px 16px;
  margin: 0 0 18px;
  font-size: 12px;
  color: #606266;
}

.bc-order-banner>span {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.bc-page-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid #e9e9ef;
}

.bc-page-actions .btn {
  height: 36px;
}

.bc-order-drawer-backdrop {
  position: fixed;
  z-index: 20;
  inset: var(--header) 0 0;
  background: #10111a52;
}

.bc-order-drawer {
  position: fixed;
  z-index: 21;
  top: var(--header);
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  width: min(1080px, max(860px, 72vw));
  background: #fff;
  box-shadow: -12px 0 32px #10111a24;
  animation: order-drawer-in 180ms ease-out;
}

.bc-order-drawer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 22px 24px 18px;
  border-bottom: 1px solid #e9e9ef;
}

.bc-order-drawer-kicker {
  display: block;
  margin-bottom: 5px;
  color: #737984;
  font-size: 12px;
}

.bc-order-drawer-header h2 {
  font-size: 18px;
  font-weight: 600;
}

.bc-order-drawer-header p {
  margin-top: 5px;
  color: #89909b;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.bc-order-drawer-content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 22px 24px 28px;
}

.bc-order-drawer-status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.bc-order-drawer-date {
  color: #737984;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.bc-order-drawer-amount {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 6px 16px;
  margin: 18px 0 24px;
  padding: 17px 18px;
  border: 1px solid #e4e1fb;
  border-radius: 8px;
  background: #f8f7ff;
  color: #5b4bd9;
  font-size: 13px;
}

.bc-order-drawer-amount strong {
  color: #28223f;
  font-size: 25px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.bc-order-drawer-amount small {
  grid-column: 1 / -1;
  color: var(--text);
  font-size: 12px;
  line-height: 1.5;
}

.bc-order-drawer-amount.is-quoted {
  border-color: var(--border);
  background: transparent;
  color: var(--text);
}

.bc-order-drawer-amount.is-quoted strong {
  font-size: 16px;
}

.bc-order-drawer-section {
  padding: 20px 0;
  border-top: 1px solid #e9e9ef;
}

.bc-order-drawer-section h3 {
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 600;
}

.bc-order-drawer-section .billing-summary {
  gap: 13px;
}

.bc-order-drawer-section .billing-summary>div {
  font-size: 12px;
}

.bc-order-drawer-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px;
  border-top: 1px solid #e9e9ef;
  background: #fff;
}

@keyframes order-drawer-in {
  from { transform: translateX(18px); opacity: .85; }
  to { transform: translateX(0); opacity: 1; }
}

.bc-checkout-grid {
  display: grid;
  grid-template-columns: minmax(0,1.5fr) minmax(300px,1fr);
  gap: 24px;
  align-items: start;
  max-width: 1300px;
}

.bc-checkout-main {
  padding: 26px;
}

.bc-renewal-choice {
  background: #f8f9fb;
  border: 1px solid #e8eaf0;
  border-radius: 7px;
  padding: 14px;
  margin-top: 20px;
  font-size: 12px;
  line-height: 1.8;
  color: #606266;
}

.bc-renewal-choice label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  font-size: 13px;
  line-height: 1.7;
}

.bc-renewal-choice input {
  margin-top: 4px;
  accent-color: var(--purple);
  flex-shrink: 0;
}

.bc-result {
  max-width: 760px;
  margin: 0 auto;
  padding: 36px 42px;
}

.bc-result-icon {
  height: 56px;
  width: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #f3f4f7;
  color: #606875;
  margin: 0 auto 18px;
}

.bc-result-icon.success {
  background: #eaf7f0;
  color: #169361;
}

.bc-result-icon.info {
  background: #eef5ff;
  color: #24549b;
}

.bc-result-icon.warning {
  background: #fff9ed;
  color: #9b6408;
}

.bc-result-icon .icon {
  width: 28px;
  height: 28px;
}

.bc-result-icon.danger {
  color: #bc493a;
  background: #fff0ed;
}

.bc-result>h2 {
  font-size: 22px;
  font-weight: 600;
  text-align: center;
}

.bc-result>p {
  font-size: 13px;
  color: #737984;
  line-height: 1.8;
  text-align: center;
  max-width: 540px;
  margin: 8px auto 0;
}

.bc-result .billing-summary {
  max-width: 520px;
  width: 100%;
  margin: 0 auto;
}

.bc-result .bc-page-actions {
  justify-content: center;
}

.billing-history th:last-child {
  width: 170px;
}

.billing-history th:nth-child(4) {
  width: 228px;
}

@media (max-width:1100px) {
  .bc-checkout-grid {
    grid-template-columns: minmax(0,1.4fr) minmax(270px,1fr);
    gap: 16px;
  }

}

@media (max-width:850px) {
  .bc-checkout-grid {
    grid-template-columns: 1fr;
  }

  .bc-result {
    padding: 28px 24px;
  }

}

@media (max-width:1023px) {
  .bc-order-drawer {
    width: calc(100vw - 32px);
  }
}

@media (max-width:700px) {
  .bc-alert {
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px;
  }

  .bc-alert>.btn {
    width: 100%;
  }

  .bc-alert>div {
    flex-basis: 85%;
  }

  .bc-order-banner {
    flex-wrap: wrap;
  }

  .bc-order-banner .btn {
    width: 100%;
  }

  .bc-page-actions {
    flex-direction: column-reverse;
    align-items: stretch;
    gap: 10px;
  }

  .bc-page-actions .btn {
    width: 100%;
    min-height: 38px;
  }

  .bc-checkout-main {
    padding: 18px;
  }

  .bc-page-head h2 {
    font-size: 17px;
  }

  .bc-result {
    padding: 24px 18px;
  }

  .bc-result>h2 {
    font-size: 20px;
  }

  .billing-history table {
    min-width: 800px;
  }

}

@media (prefers-reduced-motion:reduce) {
}

@media (max-width:700px) {
  .bc-order-drawer-header {
    padding: 18px;
  }

  .bc-order-drawer-content {
    padding: 18px 18px 24px;
  }

  .bc-order-drawer-footer {
    padding: 14px 18px;
  }

  .bc-page-actions .btn {
    min-height: 44px;
  }

  .bc-alert>.btn {
    min-height: 40px;
  }

}

@media (max-width:480px) {
  .bc-order-drawer {
    width: calc(100vw - 16px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .bc-order-drawer {
    animation: none;
  }
}

.bundle-current {
  padding: 28px 30px;
}

.bundle-current>header {
  margin-bottom: 22px;
}

.bundle-current-grid {
  display: grid;
  grid-template-columns: minmax(0,1.4fr) minmax(260px,1fr);
  gap: 50px;
}

.bundle-plan-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.4;
}

.bundle-plan-cycle {
  font-size: 12px;
  font-weight: 400;
  color: #606875;
  background: #f5f5f9;
  border: 1px solid #e5e6ed;
  padding: 3px 9px;
  border-radius: 5px;
  white-space: nowrap;
}

.bundle-inclusions {
  display: grid;
  gap: 13px;
  font-size: 13px;
  line-height: 1.6;
  color: #505968;
  margin: 18px 0 0;
  padding: 0;
  list-style: none;
}

.bundle-inclusions>div,.bundle-inclusions>li {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bundle-inclusions .icon {
  width: 16px;
  height: 16px;
  color: var(--purple);
  flex-shrink: 0;
}

.bundle-inclusions strong {
  color: #303643;
  font-weight: 600;
}

.bundle-plan-meta {
  display: flex;
  flex-direction: column;
  border-left: 1px solid #e8e9ef;
  padding-left: 32px;
}

.bundle-plan-meta .billing-card-actions {
  margin-top: 12px;
  padding-top: 20px;
}

.bundle-included {
  margin-top: 20px;
  padding: 24px 30px;
}

.bundle-included>header {
  justify-content: space-between;
  margin-bottom: 8px;
}

.bundle-meter {
  padding: 20px 0;
}

.bundle-meter+.bundle-meter {
  border-top: 1px solid #e8e9ef;
}

.bundle-meter-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 12px;
}

.bundle-meter-heading strong {
  font-weight: 600;
}

.bundle-meter-heading>span {
  font-variant-numeric: tabular-nums;
  color: #505968;
}

.bundle-track {
  height: 7px;
  background: #eeedf5;
  border-radius: 5px;
  overflow: hidden;
}

.bundle-track>span {
  display: block;
  height: 100%;
  border-radius: 5px;
  background: #8172ed;
  max-width: 100%;
}

.bundle-meter p {
  font-size: 12px;
  line-height: 1.7;
  color: #606875;
  margin: 10px 0 0;
}

.bundle-popular {
  font-size: 10px;
  color: #6553c7;
  background: #eeeafe;
  border-radius: 4px;
  padding: 4px 6px;
}

.bundle-token-detail {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 24px;
  margin-block-start: 10px;
  font-size: 12px;
  line-height: 1.7;
  color: #606875;
}

.bundle-token-detail strong {
  font-weight: 600;
  color: #303643;
  margin-left: 6px;
}

.bundle-current button,.bundle-included button {
  cursor: pointer;
}

.bundle-current button:disabled {
  cursor: not-allowed;
}

.bundle-current .billing-price {
  margin: 8px 0 15px;
}

@media (max-width:1100px) {
  .bundle-current-grid {
    gap: 28px;
  }

  .bundle-plan-meta {
    padding-left: 24px;
  }

}

@media (max-width:700px) {
  .bundle-current,.bundle-included {
    padding: 20px;
  }

  .bundle-current-grid {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .bundle-plan-meta {
    border-left: 0;
    border-top: 1px solid #e8e9ef;
    padding: 18px 0 0;
  }

  .bundle-plan-name {
    font-size: 25px;
  }

  .bundle-meter-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 4px;
  }

  .bundle-current .btn {
    min-height: 44px;
  }

  .bundle-current .billing-card-actions {
    gap: 8px;
  }

}

.billing-page {
  width: 100%;
  max-width: none;
}

.billing-shop {
  padding-top: 6px;
}

.billing-shop-heading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  margin: 0 0 26px;
  padding-top: 5px;
}

.billing-shop-heading h2 {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.4;
}

.billing-shop-heading .billing-cycle-picker {
  flex-shrink: 0;
  margin: 0;
}

.billing-shop-heading .billing-cycle-picker label>span {
  min-height: 36px;
}

.billing-shop-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 18px;
}

.billing-shop-plan {
  padding: 24px;
  box-shadow: none;
}

.billing-shop-plan.is-recommended {
  border-color: #a99df0;
  box-shadow: 0 0 0 1px #a99df026;
}

.billing-shop-plan-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 30px;
}

.billing-shop-plan-heading h3 {
  font-size: 21px;
  line-height: 1.4;
}

.billing-shop-description {
  font-size: 12px;
  line-height: 1.7;
  color: #606875;
  margin-top: 10px;
}

.billing-shop-price {
  font-size: 29px;
  font-weight: 600;
  line-height: 1.4;
  margin-top: 14px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.billing-shop-price>span {
  font-size: 12px;
  font-weight: 400;
  color: #606875;
}

.billing-shop-interval {
  display: flex;
  flex-direction: column;
  font-size: 12px;
  line-height: 1.7;
  color: #606875;
  margin-top: 3px;
  height: 46px;
  min-height: 46px;
  overflow: hidden;
}

.billing-shop-interval p {
  flex: 0 0 20px;
  margin: 0;
}

.billing-shop-core {
  list-style: none;
  padding: 0;
  margin: 19px 0;
  display: grid;
  gap: 10px;
  min-height: 51px;
}

.billing-shop-core li {
  font-size: 13px;
  line-height: 1.6;
  color: #505968;
}

.billing-shop-core strong {
  color: #303643;
  font-weight: 600;
}

.billing-shop-plan>.btn {
  width: 100%;
  min-height: 40px;
  cursor: pointer;
}

.billing-shop-plan>.btn:disabled {
  cursor: default;
  color: #606875;
  background: #f7f8fa;
  border-color: #e2e5ec;
  opacity: 1;
}

.billing-shop-plan>.btn:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 3px;
}

.billing-shop-credit {
  font-size: 11px;
  line-height: 1.7;
  color: #606875;
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  flex-wrap: wrap;
}

.billing-shop-credit .btn {
  font-size: 11px;
  padding: 0;
  height: auto;
}

.billing-shop-notes {
  display: grid;
  gap: 4px;
  margin-top: 17px;
}

.billing-shop-notes p {
  font-size: 12px;
  line-height: 1.8;
  color: #606875;
}

.billing-history-empty {
  padding: 16px 24px;
}

.billing-history-empty>h3 {
  font-size: 14px;
  line-height: 1.5;
  font-weight: 600;
}

.billing-history-empty>div {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}

.billing-history-empty>div>.icon {
  width: 22px;
  height: 22px;
  color: #8b91a0;
  flex-shrink: 0;
}

.billing-history-empty p {
  font-size: 13px;
  line-height: 1.7;
  color: #505968;
}

@media (max-width:1500px) {
  .billing-shop-grid {
    gap: 14px;
  }

  .billing-shop-plan {
    padding: 20px;
  }

  .billing-shop-plan-heading {
    align-items: flex-start;
    flex-direction: column;
    min-height: 52px;
  }

  .billing-shop-price {
    font-size: 26px;
  }

  .billing-shop-credit {
    font-size: 11px;
  }

}

@media (max-width:1279px) {
  .billing-shop-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 18px;
  }

  .billing-shop-plan-heading {
    flex-direction: row;
    align-items: center;
    min-height: 30px;
  }

  .billing-shop-price {
    font-size: 28px;
  }

  .billing-shop-plan>.btn {
    min-height: 44px;
  }

}

@media (max-width:650px) {
  .billing-shop-heading {
    gap: 13px;
    margin-bottom: 20px;
    padding-top: 3px;
  }

  .billing-shop-heading h2 {
    font-size: 18px;
  }

  .billing-shop-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .billing-shop-plan {
    padding: 22px;
  }

  .billing-shop-heading .billing-cycle-picker label>span {
    min-height: 40px;
  }

  .billing-history-empty {
    padding: 18px;
  }

  .billing-shop-notes {
    gap: 8px;
  }

  .billing-shop-credit {
    font-size: 12px;
  }

  .billing-shop-credit .btn {
    font-size: 12px;
    min-height: 36px;
  }

}


:root {
  --purple: #6d5ef6;
  --ink: #1d2129;
  --text: #3a3a48;
  --muted: #737984;
  --border: #e9e9ef;
  --bg: #f4f4f7;
  --billing-state-padding-inline: 8px;
  --billing-state-border-width: 1px;
  --side: 238px;
  --header: 51px;
  --app-header-height: var(--header);
  --app-viewport-height: 100dvh;
  --app-safe-right: env(safe-area-inset-right, 0px);
  --app-safe-bottom: env(safe-area-inset-bottom, 0px);
  --app-safe-left: env(safe-area-inset-left, 0px);
  font: 13px/1.5 Inter, 'Segoe UI', sans-serif;
  color: var(--ink);
  background: var(--bg);
}

*, *::before, *::after {
  box-sizing: border-box;
}

body, h1, h2, h3, p {
  margin: 0;
}

button, select, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 3px;
}

.icon, .topbar svg, .sidebar svg {
  width: 16px;
  height: 16px;
  flex: none;
}

.topbar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  height: var(--header);
  padding: 0 16px 0 12px;
  background: linear-gradient(180deg, #19191f, #0f0f17);
  border-bottom: 1px solid #333044;
  color: #aeb2c5;
  box-shadow: 0 12px 26px #09080f38;
  white-space: nowrap;
}

.brand {
  display: flex;
  align-items: center;
  flex: 0 0 142px;
  height: 100%;
}

.brand img {
  width: 126px;
  object-fit: contain;
}

.topnav, .toptools {
  display: flex;
  height: 100%;
  align-items: center;
}

.toptools {
  margin-left: auto;
  gap: 10px;
}

.topbar button, .user-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  color: inherit;
  background: transparent;
}

.topnav button {
  position: relative;
  height: 100%;
  padding: 0 10px;
  font-weight: 600;
}

.topnav button.active {
  color: #f8fafc;
  background: #6d5ef617;
  border-radius: 8px 8px 0 0;
}

.topnav button.active::after {
  position: absolute;
  inset: auto 16px 5px;
  height: 2px;
  background: linear-gradient(90deg, #f5a623, #f7c342);
  content: '';
}

.user-chip {
  min-height: 36px;
  padding: 4px 6px;
  font-weight: 600;
  color: #ece9f5;
  cursor: pointer;
}

.user-chip::-webkit-details-marker {
  display: none;
}

.notification-trigger {
  min-width: 30px;
  min-height: 36px;
}

.topbar .scenario-trigger {
  flex: none;
  gap: 6px;
  min-width: 36px;
  min-height: 34px;
  padding: 5px 9px;
  border: 1px solid rgb(174 164 255 / 22%);
  border-radius: 8px;
  color: #d8d1ff;
  background: rgb(109 94 246 / 13%);
  font-weight: 500;
}

.topbar .scenario-trigger:hover {
  border-color: rgb(174 164 255 / 44%);
  background: rgb(109 94 246 / 23%);
}

.account-menu {
  position: relative;
}

.account-menu-items {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 185px;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  box-shadow: 0 8px 22px #13102024;
}

.account-menu-items button {
  width: 100%;
  min-height: 36px;
  justify-content: flex-start;
  padding: 4px 8px;
}

.account-menu-items button:hover {
  background: #f4f2ff;
}

.app {
  display: flex;
  height: calc(100dvh - var(--header));
}

.sidebar {
  background: linear-gradient(180deg, #19191f, #0f0f17);
  border-right: 1px solid #302b45;
  color: #aeb2c5;
  display: flex;
  flex: 0 0 var(--side);
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}

.sidebar nav {
  padding: 12px 8px;
  overflow: auto;
}

.sidebar h2 {
  color: #9296aa;
  font-size: 11px;
  font-weight: 600;
}

.sidebar h2 button, #account-links > * {
  display: flex;
  align-items: center;
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: start;
}

.sidebar h2 button {
  justify-content: space-between;
  min-height: 30px;
  padding: 0 10px;
}

.sidebar h2 svg {
  width: 12px;
  height: 12px;
}

#account-links > * {
  position: relative;
  gap: 10px;
  min-height: 36px;
  margin-bottom: 2px;
  padding: 0 12px 0 24px;
  border-radius: 8px;
  font-weight: 600;
  text-decoration: none;
}

#account-links > :hover, #account-links > [aria-current] {
  background: #26233f;
  color: #f8fafc;
}

#account-links > [aria-current]::before {
  position: absolute;
  inset: 6px auto 6px 0;
  width: 3px;
  border-radius: 3px;
  background: #f5a623;
  content: '';
}

.sidebar-footer {
  display: grid;
  min-height: 42px;
  place-items: center;
  border: 0;
  border-top: 1px solid #2c263e;
  background: none;
  color: #a99bff;
}

.sidebar.collapsed {
  flex-basis: 56px;
}

.sidebar.collapsed h2, .sidebar.collapsed #account-links span {
  display: none;
}

.sidebar.collapsed #account-links > * {
  justify-content: center;
  padding: 0;
}

.main {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  padding: 16px 14px 18px 16px;
  overflow: hidden;
}

.main > .panel {
  flex: 1;
  min-height: 0;
  overflow: auto;
}

.page-title {
  font-size: 16px;
  line-height: 24px;
  font-weight: 400;
  margin-bottom: 12px;
}

.main > .usage-panel {
  border: 1px solid #e0e3ec;
  border-radius: 14px;
  background: #fff;
  scrollbar-gutter: stable;
}

.usage-page {
  padding: 24px 28px 32px;
}

.bc-renewal-reminder {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-block: 0 14px;
  color: var(--text);
}

.bc-renewal-reminder > .bc-renewal-reminder-content {
  display: flex;
  flex: 0 1 auto;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.5;
}

.bc-renewal-reminder-content svg {
  flex: none;
  margin-block-start: 3px;
}

.bc-renewal-reminder strong {
  font-size: 13px;
  font-weight: 600;
}

.bc-renewal-reminder p {
  margin-block: 2px 0;
  font-size: 12px;
  line-height: 1.5;
}

.bc-renewal-reminder > .btn {
  flex-shrink: 0;
  width: auto;
  margin-inline-start: auto;
}

.bc-renewal-reminder.bc-alert {
  padding: 10px 12px;
}

.bc-usage-page-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  margin-block-end: 12px;
}

.bc-usage-page-heading .page-title {
  margin-block-end: 0;
}

.usage-page .bundle-usage-overview {
  margin: 0 0 24px;
  padding: 12px 20px 8px;
  box-shadow: none;
}

.bundle-usage-overview .bundle-meter {
  padding-block: 16px 20px;
}

.bc-usage-compact .bundle-meter {
  padding-block: 8px;
}

.bc-usage-compact > .bundle-meter + .bundle-meter {
  border-block-start: 0;
}

.bc-usage-compact .bundle-meter-heading {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  margin-bottom: 0;
}

.bc-usage-compact .bundle-meter-heading > span {
  margin-inline-start: auto;
  color: var(--text);
  font-weight: 600;
}

.bc-usage-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 8px;
  margin-block-start: 8px;
  padding-block-start: 4px;
  border-block-start: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

.bc-usage-meta .btn.link {
  padding-inline: 4px;
  white-space: nowrap;
}

.bc-usage-meta .btn.link:hover {
  border-color: transparent;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.bc-usage-access-note {
  margin-block: 0 12px;
  color: var(--text);
  font-size: 12px;
  line-height: 1.6;
}

.bc-renewal-usage {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
}

.bc-renewal-usage a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.bc-scheduled-notice {
  margin-top: 20px;
  padding: 14px 16px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
}

.bc-scheduled-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  margin-bottom: 6px;
}

.bc-scheduled-heading h4 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}

.bc-scheduled-notice > p,
.bc-scheduled-comparison thead span {
  color: var(--text);
}

.bc-scheduled-storage-warning {
  display: grid;
  gap: 4px;
  margin-block-start: 8px;
}

.billing-facts .bc-renewal-risk-status {
  color: #795d25;
}

.bc-scheduled-risk-options {
  display: grid;
  gap: 4px;
  margin-block-start: 4px;
}

.bc-scheduled-risk-options button.bc-dialog-link {
  padding: 0;
  border: 0;
  background: transparent;
}

.bc-scheduled-comparison {
  width: 100%;
  margin-top: 10px;
  border-collapse: collapse;
  table-layout: fixed;
  font-variant-numeric: tabular-nums;
}

.bc-scheduled-comparison :is(th, td) {
  padding: 7px 6px;
  border-bottom: 1px solid var(--border);
  text-align: start;
  overflow-wrap: anywhere;
}

.bc-scheduled-comparison th:first-child {
  width: 36%;
  padding-inline-start: 0;
}

.bc-scheduled-comparison tbody th {
  font-weight: 400;
  color: var(--text);
}

.bc-scheduled-comparison thead span {
  display: block;
  font-weight: 400;
}

.bc-scheduled-value {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
}

.bc-scheduled-value strong {
  font-weight: 600;
}

.bc-scheduled-delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-width: 0;
  color: color-mix(in srgb, var(--muted) 80%, var(--text));
}

.bc-scheduled-delta svg {
  flex: none;
  width: 12px;
  height: 12px;
}

.bc-schedule-cancel.btn {
  background: var(--bg);
  font-weight: 500;
}

.bc-schedule-cancel .icon {
  width: 15px;
  height: 15px;
}

.bc-blocked-renewal-summary {
  margin-block-end: 16px;
}

.bc-blocked-renewal-summary > .bc-scheduled-storage-warning {
  margin-block-start: 0;
}

.bc-blocked-renewal-summary h3 {
  font-size: 14px;
  font-weight: 600;
}

.bc-original-plan-expiry {
  margin-block-start: 4px;
  color: var(--text);
}

.bc-scheduled-renewal-ready-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}

.bc-renewal-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
  gap: 16px 24px;
  margin-top: 12px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

.bc-renewal-option {
  display: grid;
  grid-template-rows: auto 1fr auto;
  justify-items: start;
  gap: 6px;
  line-height: 1.6;
}

.bc-renewal-option h4 {
  margin: 0;
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
}

.bc-renewal-option .btn {
  margin-top: 4px;
}

.billing-shop-grid.bc-eligible-plans {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
}

.supplemental-usage {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding-bottom: 20px;
}

.supplemental-usage > h3 {
  grid-column: 1 / -1;
  font-size: 14px;
  font-weight: 600;
}

.supplemental-usage-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 66px;
  gap: 6px 12px;
  align-items: center;
  padding: 12px;
  border: 1px solid #e0e3ec;
  border-radius: 12px;
  background: #f8f9fb;
  color: #606875;
  font-size: 12px;
}

.supplemental-usage-card strong, .supplemental-usage-status {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.supplemental-usage-card strong {
  color: var(--ink);
  font-weight: 400;
}

.supplemental-usage-track {
  height: 6px;
  overflow: hidden;
  border-radius: 5px;
  background: #e8ebf2;
}

.supplemental-usage-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--purple);
}

.btn, .control {
  min-height: 32px;
  padding: 4px 12px;
  border: 1px solid #dfe1e8;
  border-radius: 5px;
  background: #fff;
  color: var(--ink);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn:hover:not(:disabled) {
  border-color: var(--purple);
  color: var(--purple);
}

.btn.primary {
  background: var(--purple);
  border-color: var(--purple);
  color: white;
}

.btn.primary:hover:not(:disabled) {
  background: #5b4bd9;
  color: white;
}

.btn.link {
  color: #5b4bd9;
  border-color: transparent;
  background: transparent;
}

.btn.icon-only {
  width: 32px;
  padding: 0;
}

@media (min-width: 1280px) {
  .paid-plans {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.billing-shop-price {
  color: var(--ink);
  font-weight: 700;
}

.billing-shop-intro {
  display: grid;
  gap: 6px;
  max-width: 52ch;
  text-align: center;
}

.billing-shop-intro p {
  color: var(--text);
  line-height: 1.6;
}

.plan-yearly-savings {
  margin-top: 3px;
  color: #13704d;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.billing-shop-core {
  gap: 8px;
  min-height: 0;
  padding: 12px;
  border: 1px solid #e9e9ef;
  border-radius: 8px;
  background: #f7f7fa;
}

.billing-shop-plan.is-recommended .billing-shop-core {
  border-color: #e8e3fa;
  background: #f7f5ff;
}

.billing-shop-core strong {
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.billing-shop-notes strong {
  font-weight: 600;
}

.billing-record-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  gap: 4px 8px;
}

.billing-record-actions .btn {
  padding-inline: 0;
  border-inline-width: 0;
  border-color: transparent;
  white-space: nowrap;
}

.billing-record-actions .btn:hover:not(:disabled) {
  border-color: transparent;
  text-decoration: underline;
}

.billing-record-hint {
  display: block;
  margin-top: 4px;
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
}

.bc-order-status-banner {
  --order-notice-ink: #795d25;
  --order-notice-bg: #fffcf3;
