<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">HyperBDR Disaster Recovery Network Configuration</title>
  <desc id="desc">Thumbnail representing Step 5 Network Configuration prototype: dual Drill/Takeover scenarios, inheritance toggle, VPC/subnet setup, single/multi-NIC, and host IP/security group mapping table.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="300" fill="#f8fafc"/>

  <!-- Top Brand Navigation Bar -->
  <rect width="480" height="36" fill="#1e293b"/>
  <!-- Logo Shield -->
  <path d="M14 9h16v6c0 6-3.5 10.5-8 13-4.5-2.5-8-7-8-13V9Z" fill="#38bdf8"/>
  <path d="M18 13h8v4c0 2.5-1.5 4.5-4 6-2.5-1.5-4-3.5-4-6v-4Z" fill="#e0f2fe"/>
  <text x="36" y="23" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700">HyperBDR</text>
  <text x="104" y="23" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12">/</text>
  <text x="114" y="23" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11">DR Configuration</text>

  <!-- Step 5 Tag Badge -->
  <rect x="382" y="9" width="84" height="18" rx="9" fill="#2563eb"/>
  <circle cx="393" cy="18" r="3.5" fill="#60a5fa"/>
  <text x="430" y="22" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Step 5: Network</text>

  <!-- 7-Step Mini Wizard Bar -->
  <rect x="12" y="42" width="456" height="26" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Connecting line -->
  <line x1="38" y1="55" x2="435" y2="55" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step 1-4 Done -->
  <circle cx="38" cy="55" r="6" fill="#22c55e"/>
  <path d="m35 55 2 2 4-4" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <text x="56" y="58" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">Platform</text>

  <circle cx="100" cy="55" r="6" fill="#22c55e"/>
  <path d="m97 55 2 2 4-4" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <text x="118" y="58" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">Gateway</text>

  <circle cx="160" cy="55" r="6" fill="#22c55e"/>
  <path d="m157 55 2 2 4-4" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <text x="178" y="58" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">Compute</text>

  <circle cx="220" cy="55" r="6" fill="#22c55e"/>
  <path d="m217 55 2 2 4-4" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <text x="238" y="58" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">Storage</text>

  <!-- Step 5: Active -->
  <circle cx="282" cy="55" r="8" fill="#2563eb"/>
  <text x="282" y="58.5" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="700" text-anchor="middle">5</text>
  <text x="312" y="58.5" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="700">Network</text>

  <!-- Step 6-7: Pending -->
  <circle cx="360" cy="55" r="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="58" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" text-anchor="middle">6</text>
  <text x="382" y="58" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">Advanced</text>

  <circle cx="422" cy="55" r="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="422" y="58" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" text-anchor="middle">7</text>
  <text x="440" y="58" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">Policy</text>

  <!-- Dual Scenario Switcher Bar (The Core Improved Feature!) -->
  <rect x="12" y="73" width="456" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="22" y="92" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="700">Network Purpose:</text>

  <!-- Drill Network Tab (Selected) -->
  <rect x="114" y="77" width="98" height="22" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <circle cx="125" cy="88" r="3" fill="#2563eb"/>
  <text x="162" y="92" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Drill Network</text>

  <!-- Takeover Network Tab -->
  <rect x="218" y="77" width="104" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="270" y="92" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9.5" font-weight="500" text-anchor="middle">Takeover Network</text>

  <!-- Inheritance Checkbox -->
  <rect x="334" y="82" width="12" height="12" rx="2.5" fill="#2563eb"/>
  <path d="m336.5 88 2 2 4.5-4.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <text x="352" y="92" fill="#1e293b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="9" font-weight="600">Takeover matches Drill</text>

