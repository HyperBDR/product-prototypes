  <text x="46" y="127" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" font-weight="600" text-anchor="middle">Single NIC</text>

  <rect x="73" y="115" width="48" height="17" rx="3" fill="#f1f5f9"/>
  <text x="97" y="127" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" text-anchor="middle">Multi-NIC</text>

  <!-- VPC Dropdown -->
  <text x="134" y="127" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="600">* Network:</text>
  <rect x="180" y="115" width="108" height="17" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="186" y="127" fill="#1e293b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">vpc-ray (10.0.0.0/8)</text>
  <path d="m278 122 3 4 3-4" fill="#64748b"/>

  <!-- Subnet Dropdown -->
  <text x="300" y="127" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="600">* Subnet:</text>
  <rect x="344" y="115" width="114" height="17" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="350" y="127" fill="#1e293b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8">subnet-ray (10.0.0.0/24)</text>
  <path d="m448 122 3 4 3-4" fill="#64748b"/>

  <!-- Batch Action Toolbar -->
  <line x1="12" y1="138" x2="468" y2="138" stroke="#f1f5f9" stroke-width="1"/>

  <rect x="22" y="142" width="76" height="15" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="153" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="500" text-anchor="middle">Batch Private IP</text>

  <rect x="104" y="142" width="76" height="15" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="142" y="153" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="500" text-anchor="middle">Batch Public IP</text>

  <rect x="186" y="142" width="76" height="15" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="224" y="153" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="500" text-anchor="middle">Batch SecGroup</text>

  <text x="458" y="153" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8" text-anchor="end">Selected: 2 / 2 Hosts</text>

  <!-- Hosts Network Mapping Table -->
  <!-- Table Header -->
  <rect x="20" y="161" width="440" height="16" fill="#f8fafc"/>
  <rect x="24" y="164.5" width="9" height="9" rx="2" fill="#2563eb"/>
  <path d="m26 169 1.5 1.5 3-3" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <text x="38" y="173" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600">Host Name</text>
  <text x="136" y="173" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600">Host IP / ESXi</text>
  <text x="216" y="173" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600">Private IP</text>
  <text x="296" y="173" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600">Public IP (EIP)</text>
  <text x="382" y="173" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600">Security Group</text>

  <!-- Row 1: Linux Host -->
  <line x1="20" y1="178" x2="460" y2="178" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="24" y="184" width="9" height="9" rx="2" fill="#2563eb"/>
  <path d="m26 188.5 1.5 1.5 3-3" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <text x="38" y="191" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600">ZhangTianJie-TestSync5</text>
  <text x="136" y="191" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7">192.168.10.3 (ESXi)</text>

  <!-- Row 1: Private IP pill -->
  <rect x="216" y="181" width="68" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="250" y="191" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7" text-anchor="middle">Auto Allocated</text>

  <!-- Row 1: Public IP pill -->
  <rect x="296" y="181" width="76" height="14" rx="2" fill="#fef3c7" stroke="#fde68a"/>
  <text x="334" y="191" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7" font-weight="600" text-anchor="middle">New EIP · 5 Mbps</text>

  <!-- Row 1: Security Group pill -->
  <rect x="382" y="181" width="74" height="14" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="419" y="191" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7" text-anchor="middle">mhmceshiproxy</text>

  <!-- Row 2: Windows Host -->
  <line x1="20" y1="198" x2="460" y2="198" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="24" y="204" width="9" height="9" rx="2" fill="#2563eb"/>
  <path d="m26 208.5 1.5 1.5 3-3" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <text x="38" y="211" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5" font-weight="600">ZhangTianJie-TestSync2</text>
  <text x="136" y="211" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7">192.168.10.3 (ESXi)</text>

  <!-- Row 2: Private IP pill -->
  <rect x="216" y="201" width="68" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="250" y="211" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7" text-anchor="middle">Auto Allocated</text>

  <!-- Row 2: Public IP pill -->
  <rect x="296" y="201" width="76" height="14" rx="2" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="334" y="211" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7" text-anchor="middle">Unassigned</text>

  <!-- Row 2: Security Group pill -->
  <rect x="382" y="201" width="74" height="14" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="419" y="211" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7" text-anchor="middle">mhmceshiproxy</text>

  <!-- Row 3: Single NIC Hint -->
  <line x1="20" y1="218" x2="460" y2="218" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="20" y="222" width="440" height="24" rx="3" fill="#f8fafc"/>
  <circle cx="32" cy="234" r="4" fill="#38bdf8"/>
  <text x="42" y="237" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="7.5">Dual-Purpose &amp; Multi-NIC: Switch to "Takeover Network" or "Multi-NIC" drawer to customize NICs and independent IP/EIP bindings.</text>

  <!-- Bottom Navigation / Action Bar -->
  <rect x="12" y="260" width="456" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <!-- Status hint on left -->
  <circle cx="26" cy="276" r="4.5" fill="#3b82f6"/>
  <path d="M26 273.5v2.5M26 278v.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <text x="36" y="279" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5">Dual Scenario Sync · Single/Multi-NIC · Inline Batching · Bilingual i18n</text>

  <!-- Action Buttons on right -->
  <rect x="334" y="266" width="38" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="353" y="279.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" text-anchor="middle">Cancel</text>

  <rect x="378" y="266" width="44" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="400" y="279.5" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" text-anchor="middle">Previous</text>

  <rect x="428" y="266" width="34" height="20" rx="3" fill="#2563eb"/>
  <text x="445" y="279.5" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Next</text>
</svg>
