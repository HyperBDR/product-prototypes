<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="thumbnail-title thumbnail-description">
  <title id="thumbnail-title">HyperBDR 智能体集成</title>
  <desc id="thumbnail-description">生成智能体安装提示词。左侧包含智能体集成、令牌管理和审计日志。令牌选择默认为空，显示请选择，生成按钮为禁用状态。</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#595959}
      .nav,.nav text{font-size:9px;fill:#fff;text-anchor:middle}
      .side{font-size:11px}
      .label{font-size:11px;font-weight:700;fill:#262626}
      .muted{font-size:10px;fill:#bfbfbf}
    </style>
  </defs>
  <rect width="640" height="360" fill="#f5f5f5"/>
  <!-- Navbar, using the existing local brand asset embedded for a standalone SVG. -->
  <rect width="640" height="36" fill="#262626"/>
  <image x="8" y="0" width="118" height="36" href="data:image/png;base64,"/>
  <path d="M130 13h12m-12 5h12m-12 5h12" fill="none" stroke="#fff" stroke-width="1.4"/>
  <g class="nav">
    <text x="163" y="22">概览</text>
    <text x="200" y="22">资源容灾</text>
    <text x="244" y="22">资源编排</text>
    <text x="288" y="22">配置管理</text>
    <text x="332" y="22">运维管理</text>
    <text x="391" y="22">监控与告警管理</text>
    <text x="445" y="22">设置</text>
  </g>
  <rect x="462" width="74" height="36" fill="#457ab0"/>
  <text class="nav" x="499" y="22" style="font-size:10px">智能体集成</text>
  <rect x="548" y="10" width="22" height="16" rx="8" fill="#493d2c"/>
  <circle cx="560" cy="18" r="6" fill="#f09024"/>
  <text x="560" y="21" text-anchor="middle" style="font-size:8px;fill:#fff">0</text>
  <rect x="577" y="10" width="23" height="16" rx="8" fill="#d73434"/>
  <text x="588.5" y="21" text-anchor="middle" style="font-size:8px;fill:#fff">99+</text>
  <text x="608" y="22" style="font-size:10px;fill:#fff">admin</text>
  <!-- Sidebar follows newmuse's neutral background and blue active item. -->
  <path d="M95.5 36v324" stroke="#d9d9d9"/>
  <g transform="translate(11 49)" fill="none" stroke="#457ab0" stroke-width="1.2">
    <rect x="0" y="1" width="12" height="9" rx="2"/>
    <path d="M6 1v-3M3 11l-1 3m7-3 1 3"/>
    <circle cx="3.5" cy="5" r=".7" fill="#457ab0"/>
    <circle cx="8.5" cy="5" r=".7" fill="#457ab0"/>
  </g>
  <text x="28" y="59" style="font-size:11px">智能体集成</text>
  <rect x="6" y="72" width="84" height="28" rx="2" fill="#457ab0"/>
  <text class="side" x="20" y="90" style="fill:#fff">智能体集成</text>
  <text class="side" x="20" y="120">令牌管理</text>
  <text class="side" x="20" y="148">审计日志</text>
  <rect x="95.5" y="192" width="10" height="28" fill="#fff" stroke="#d9d9d9"/>
  <path d="m102 202-3 4 3 4" fill="none" stroke="#457ab0"/>
  <!-- Integration form: no default token, searchable selector and empty prompt. -->
  <text x="108" y="59" style="font-size:13px;fill:#262626">智能体集成</text>
  <rect x="108" y="78" width="520" height="264" rx="4" fill="#fff" filter="url(#card-shadow)"/>
  <text x="120" y="101" style="font-size:14px;font-weight:700;fill:#262626">生成智能体安装提示词</text>
  <text x="120" y="118" style="font-size:9px;fill:#8c8c8c">选择或生成令牌后生成专属安装提示词</text>
  <text class="label" x="120" y="140">令牌编号</text>
  <rect x="120.5" y="148.5" width="265" height="27" rx="2" fill="#fff" stroke="#d0d0d0"/>
  <text class="muted" x="130" y="166">请选择</text>
  <path d="m370 160 4 4 4-4" fill="none" stroke="#bfbfbf" stroke-width="1.1"/>
  <rect x="394.5" y="148.5" width="105" height="27" rx="2" fill="#fff" stroke="#d9d9d9"/>
  <path d="M405 157v10m-5-5h10" fill="none" stroke="#595959"/>
  <text x="415" y="166" style="font-size:10px;fill:#262626">创建访问令牌</text>
  <rect x="508.5" y="148.5" width="107" height="27" rx="2" fill="#f5f5f5" stroke="#d9d9d9"/>
  <text x="562" y="166" text-anchor="middle" class="muted">生成提示词</text>
  <text class="label" x="120" y="198">安装提示词</text>
  <rect x="120.5" y="206.5" width="495" height="89" rx="2" fill="#fff" stroke="#d0d0d0"/>
  <text x="130" y="226" style="font-size:10px;fill:#a6a6a6">请先选择一个已启用的令牌编号</text>
  <rect x="120" y="306" width="496" height="20" rx="2" fill="#fffaf0"/>
  <text x="130" y="319" style="font-size:9px;fill:#8c8c8c">提示词包含访问令牌，请仅在可信的智能体会话中使用。</text>
</svg>
