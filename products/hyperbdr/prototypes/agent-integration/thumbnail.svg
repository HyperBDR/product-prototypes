<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="thumbnail-title thumbnail-description">
  <title id="thumbnail-title">HyperBDR Agent Integration</title>
  <desc id="thumbnail-description">English Agent Integration page. The first enabled token is selected and its installation prompt is ready. The usage guide includes steps 01, 02 and 03, four scenario tabs, and the Install and Connect card.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".08"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#595959}
      .nav{font-size:7px;fill:#fff;text-anchor:middle}.side{font-size:9px}.title{font-size:11px;font-weight:700;fill:#262626}.label{font-size:8px;fill:#595959}.help{font-size:7px;fill:#8c8c8c}.button{font-size:8px;fill:#262626;text-anchor:middle}.step{font-size:7.5px;font-weight:700;fill:#262626}.number{font-size:7px;font-weight:600;fill:#2f598a;text-anchor:middle}
    </style>
  </defs>
