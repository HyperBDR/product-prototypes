  <text x="130" y="160" style="font-size:7.5px;fill:#262626">Install and configure the HyperBDR agent integration on this machine:</text>
  <text x="130" y="174" style="font-size:7px;fill:#262626">npx hyperbdr-agent-kit install --url https://hyperbdr.com --api-key ...</text>
