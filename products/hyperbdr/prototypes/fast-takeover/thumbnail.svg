<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">HyperBDR Disaster Recovery Takeover and Fast Takeover</title>
  <desc id="desc">A prototype thumbnail showing host takeover from a selected recovery point, or Fast Takeover from a cloud sync gateway target disk after policies are unbound.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#397dd8"/>
      <stop offset="1" stop-color="#235bc1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#315b93" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="480" height="300" fill="url(#background)"/>

  <!-- Brand bar -->
  <rect width="480" height="52" fill="#192532"/>
  <path d="M22 12h25v10c0 10-5.5 16-12.5 20C27.5 38 22 32 22 22V12Z" fill="#4097ca"/>
  <path d="M29 18h11v6c0 4-2 7.3-5.5 9.7C31 31.3 29 28 29 24v-6Z" fill="#e2f2fa"/>
  <text x="59" y="34" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">HyperBDR</text>
  <rect x="374" y="15" width="82" height="24" rx="12" fill="#263746"/>
  <circle cx="390" cy="27" r="4" fill="#59c535"/>
  <text x="401" y="31" fill="#dce7ee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Host DR</text>

  <!-- Clear feature title -->
  <text x="240" y="91" fill="#203349" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Takeover &amp; Fast Takeover</text>
  <text x="240" y="116" fill="#647a91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Select a recovery point, or unbind policies for Fast Takeover</text>

  <!-- Simple state flow -->
  <g filter="url(#shadow)">
    <rect x="42" y="139" width="148" height="79" rx="10" fill="#fff"/>
    <rect x="290" y="139" width="148" height="79" rx="10" fill="url(#gateway)"/>
  </g>

  <circle cx="75" cy="169" r="16" fill="#eaf8e5"/>
  <path d="m67 169 5 5 11-12" fill="none" stroke="#52b932" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="169" fill="#263b50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Host Sync</text>
  <text x="130" y="193" fill="#52a936" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sync Complete</text>

  <path d="M210 178h49" fill="none" stroke="#3977cc" stroke-width="5" stroke-linecap="round"/>
  <path d="m251 166 14 12-14 12" fill="none" stroke="#3977cc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(308 153)" fill="none" stroke="#fff" stroke-width="2.2">
    <ellipse cx="16" cy="8" rx="13" ry="6" fill="#fff" fill-opacity=".18"/>
    <path d="M3 8v18c0 3.3 5.8 6 13 6s13-2.7 13-6V8M3 17c0 3.3 5.8 6 13 6s13-2.7 13-6"/>
  </g>
  <text x="384" y="169" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Gateway Disk</text>
  <text x="384" y="193" fill="#dceaff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Fast Takeover</text>

  <!-- One key product rule -->
  <rect x="79" y="244" width="322" height="36" rx="18" fill="#fff7e8" stroke="#f2a345"/>
  <circle cx="101" cy="262" r="9" fill="#f29a32"/>
  <text x="101" y="266" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">!</text>
  <text x="247" y="267" fill="#a9600f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Unbind Policies → Confirm Risk → Fast Takeover</text>
</svg>
