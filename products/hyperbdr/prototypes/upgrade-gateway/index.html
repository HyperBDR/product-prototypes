<script id="prototype-model">
const HOST_LABELS={waiting:'等待升级',queued:'准备中',upgrading:'升级中',latest:'无需升级',failed:'升级失败',completed:'升级完成',unsupported:'不支持升级',unreported:'获取版本失败'};

function versions(v){return ['hyper_exporter','s3block'].map(name=>({name,version:v}));}
function createScenes(){
 const states=['failed','waiting','queued','upgrading','latest','completed','unsupported','unreported'];
 return Object.fromEntries(['dr','breakBack'].map(scene=>[scene,states.map((status,i)=>{
  const id=scene+'-gw-'+(i+1),platform=['OpenStack','OpenStack','阿里云','华为云','OpenStack','OpenStack','VMware','OpenStack'][i];
  const row={id,name:(scene==='breakBack'?'FAILBACK':'CLOUD_SYNC')+'_GATEWAY_192.168.'+(scene==='dr'?'14':'20')+'.'+(199+i),account:i<2?'openstack_20261106143557':['','','aliyun','huawei','openstack','openstack','vmware','openstack'][i]+'_20261106143557',platform,user:i===6?'administrator':'autotest',protocol:i===6?'iSCSI':'S3Block',online:i!==7,healthy:i!==7,status,versions:versions(['latest','completed'].includes(status)?'v7.10.1.dev3':i===6?'v6.1.0':'v7.10.0'),target:versions('v7.10.1.dev3'),tasks:[]};
  function task(s,day,index){const date='2026-11-'+String(day).padStart(2,'0');return{id:id+'-task-'+index,hostId:id,status:s,created:date+' 15:55:22',start:['waiting','aborted'].includes(s)?'':date+' 15:55:29',end:['done','failed','aborted'].includes(s)?date+' 15:57:06':'',pre:versions('v7.10.0'),post:['waiting','running','aborted'].includes(s)?[]:versions('v7.10.1.dev3'),message:s==='failed'?'升级组件 s3block 失败：网关服务重启后未在预期时间内响应，请检查网关网络连接和服务状态。':''};}
  if(status==='failed')row.tasks=[task('failed',13,1),task('done',12,2),task('aborted',11,3)];
  if(status==='queued')row.tasks=[task('waiting',15,1),task('aborted',12,2)];
  if(status==='upgrading')row.tasks=[task('running',15,1),task('done',12,2)];
  if(status==='completed'||status==='latest')row.tasks=[task('done',15,1)];
  if(i===0)row.versions=versions('v7.10.1.dev3');
  return row;
 })]));
}
function gatewayVersions(row){return ['unreported','completed'].includes(row.status)?[]:row.versions;}
function canUpgrade(row){return !!row&&['waiting','failed'].includes(row.status)&&row.online&&row.protocol==='S3Block';}
function formatTime(ms){return new Date(ms+8*3600000).toISOString().slice(0,19).replace('T',' ');}
class UpgradeModel{
 constructor(scenes=createScenes()){
  this.scenes=scenes;
  // Remove only the duplicate completed demo identified by the user.
  // Do not deduplicate arbitrary gateway upgrades or alter other states.
  if(scenes.dr.some(r=>r.id==='dr-gw-6'&&r.status==='completed')){
   scenes.dr=scenes.dr.filter(r=>!(r.id==='dr-gw-3'&&r.status==='completed'));
  }
 }
 rows(scene){return this.scenes[scene];}
 find(id){return Object.values(this.scenes).flat().find(r=>r.id===id);}
 start(ids,now=Date.now()){
  const started=[];
  for(const id of ids){const row=this.find(id);if(!canUpgrade(row))continue;
   const task={id:id+'-task-'+now+'-'+row.tasks.length,hostId:id,status:'waiting',created:formatTime(now),start:'',end:'',pre:structuredClone(row.versions),post:[],message:'',simulationStart:now};
   row.tasks.unshift(task);row.status='queued';started.push(task);

  const row=this.find(id),task=row?.tasks[0];if(!row||row.status!=='queued'||task?.status!=='waiting')return false;

 }
 tick(now=Date.now()){
  let changed=false;
  for(const row of Object.values(this.scenes).flat()){
   const task=row.tasks[0];if(!task||task.simulationStart===undefined)continue;
   const elapsed=now-task.simulationStart;
   if(elapsed>=16000&&task.status!=='done'){
    task.status='done';task.end=formatTime(task.simulationStart+16000);task.start=formatTime(task.simulationStart+6000);task.post=structuredClone(row.target);row.versions=structuredClone(row.target);row.status='completed';delete task.simulationStart;changed=true;
   }else if(elapsed>=6000&&task.status==='waiting'){
    task.status='running';task.start=formatTime(task.simulationStart+6000);row.status='upgrading';changed=true;
   }
  }return changed;
 }
}
</script><script>

function filtered(){const query=$('searchInput').value.trim().toLowerCase();let list=model.rows(scene).filter(r=>searchType==='name'?(!query||r.name.toLowerCase().includes(query)):statusFilter==='enable'?canUpgrade(r):(!statusFilter||r.status===statusFilter));if(sortKey)list=[...list].sort((a,b)=>String(a[sortKey]).localeCompare(String(b[sortKey]),'zh')*sortDirection);return list;}
function versionHtml(items){return items.length?items.map(v=>'<div class="version-line" title="'+esc(v.name+' '+v.version)+'">'+esc(v.name)+' '+esc(v.version)+'</div>').join(''):'-';}
function stateHtml(status,id,task=false){
 let icon=['waiting','running','queued','upgrading'].includes(status)?'loading spin':['done','latest','completed'].includes(status)?'success':status==='failed'?'error':status==='aborted'?'remove':status==='unreported'?'warning':'fa-up';

 return '<div class="state-line '+status+'"><i class="'+(icon==='fa-up'?'fa':'ei')+' '+icon+'"></i><span>'+esc(label)+'</span></div>'+action;
}

 $('selectedCount').textContent=t('common.selected')+' '+selected.size; $('totalCount').textContent=t('common.total')+' '+list.length; $('pageSizeLabel').textContent=pageSizeText(pageSize);refreshPageSizeLabels();$('upgradeBtn').disabled=!selected.size;
 const eligible=visible.filter(canUpgrade);$('selectAll').disabled=!eligible.length;$('selectAll').checked=eligible.length>0&&eligible.every(r=>selected.has(r.id));$('selectAll').indeterminate=eligible.some(r=>selected.has(r.id))&&!$('selectAll').checked;
 $('prevPage').disabled=page<=1;$('nextPage').disabled=page>=pages;$('jumpPage').value=page;$('jumpPage').max=pages;
 $('pageButtons').innerHTML=Array.from({length:pages},(_,i)=>'<button data-page="'+(i+1)+'" class="'+(page===i+1?'current':'')+'" aria-label="第 '+(i+1)+' 页">'+(i+1)+'</button>').join(' ');
 syncFixedColumnShadow();if(recordHost)drawRecords();if(detailTask)drawDetail();
}
function openDrawer(id){lastFocus=document.activeElement;$(id).classList.add('open');document.body.style.overflow='hidden';$(id).querySelector('.close').focus();}
function closeDrawer(id){$(id).classList.remove('open');if(id==='recordsBackdrop')recordHost=null;if(id==='detailBackdrop')detailTask=null;if(!$('recordsBackdrop').classList.contains('open')&&!$('detailBackdrop').classList.contains('open'))document.body.style.overflow='';if(id==='detailBackdrop'&&recordHost)$('recordsClose').focus();else if(lastFocus?.isConnected)lastFocus.focus();}
function openRecords(id){recordHost=id;recordPage=1;recordSort='';drawRecords();openDrawer('recordsBackdrop');}
function drawRecords(){
 const row=model.find(recordHost);if(!row)return;let tasks=[...row.tasks];if(recordSort)tasks.sort((a,b)=>String(a[recordSort]).localeCompare(String(b[recordSort]))*recordDir);
 const pages=Math.max(1,Math.ceil(tasks.length/recordSize));recordPage=Math.min(recordPage,pages);const visible=tasks.slice((recordPage-1)*recordSize,recordPage*recordSize);
 $('recordRows').innerHTML=visible.length?visible.map(t=>'<tr><td>'+esc(t.created)+'</td><td>'+(esc(t.start)||'-')+'</td><td>'+(esc(t.end)||'-')+'</td><td>'+versionHtml(t.pre)+'</td><td>'+versionHtml(t.post)+'</td><td>'+stateHtml(t.status,t.id,true)+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">'+t('common.noData')+'</td></tr>';
 $('recordTotal').textContent=t('common.total')+' '+tasks.length;$('recordPage').textContent=recordPage;$('recordJump').value=recordPage;$('recordJump').max=pages;$('recordPrev').disabled=recordPage<=1;$('recordNext').disabled=recordPage>=pages;
}
function getTask(id,isTask){return isTask?Object.values(model.scenes).flat().flatMap(r=>r.tasks).find(t=>t.id===id):model.find(id)?.tasks[0];}
function openDetail(id,isTask){const task=getTask(id,isTask);if(!task)return;detailTask=task.id;showDetails=true;drawDetail('bottom');openDrawer('detailBackdrop');const scroller=$('detailContent').querySelector('.content-container');if(scroller)scroller.scrollTop=scroller.scrollHeight;}
function logsFor(t){
 const base=t.start||t.created;
 const lines=[
  {time:base,level:'info',line:'Creating temporary directory at /tmp/upgrade_gateway_demo.'},
  {time:base,level:'info',line:'Retrieving the file bootloader from the upgrade package repository.'},
  {time:base,level:'info',line:'Retrieving the file hyper_exporter.tar.gz from the upgrade package repository.'},
  {time:base,level:'info',line:'Retrieving the file s3block.tar.gz from the upgrade package repository.'},
  {time:base,level:'info',line:'Running hyper upgrade program.'},
  {time:base,level:'info',line:'Running bootloader using bash -c (systemd-run --unit=hyperbdr-upgrade --scope /tmp/upgrade_gateway_demo/bootloader >>/tmp/upgrade_gateway_demo/stdout.log 2>>/tmp/upgrade_gateway_demo/stderr.log)'}
 ];
 if(t.status==='running') lines.push({time:t.start||t.created,level:'running',line:'Updating hyper_exporter and s3block components. Waiting for the gateway service to restart...'});
 if(t.status==='done') lines.push({time:t.end||t.start||t.created,level:'done',line:'successfully upgraded the hyper exporter.\nsuccessfully upgraded s3block.\nHyper upgrade program has ended'});
 if(t.status==='failed') lines.push({time:t.end||t.start||t.created,level:'failed',line:'Hyper upgrade program with error: service restart timed out.\n'+(t.message||'The gateway service did not respond within the expected time.')});
 return lines.map(l=>({...l,line:l.line.replace(/\r/g,'\n')}));
}
function logIcon(level){return level==='failed'?'error':(['waiting','queued','running','upgrading'].includes(level)?'loading spin':level==='aborted'?'remove':level==='done'?'success':'');}
function renderTimelineNode(level,large=false){const icon=logIcon(level);return '<div class="el-timeline-item__tail"></div><div class="el-timeline-item__node el-timeline-item__node--'+(large?'large':'normal')+'">'+(icon?'<i class="el-timeline-item__icon ei '+icon+'"></i>':'')+'</div>';}
function drawDetail(scrollAction='preserve'){
 const task=getTask(detailTask,true);if(!task)return;
 const display=statusLabel(task.status,true), logs=logsFor(task), oldScroll=$('detailContent').querySelector('.content-container')?.scrollTop||0;
 const stateClass=task.status==='running'?'doing':task.status;
 $('detailContent').innerHTML='<div class="customJobDetail"><div class="title-conainer"><p class="title"><span>'+t('detail.status')+'</span><span>'+esc(display)+'</span></p>'+(task.status==='failed'&&task.message?'<p class="title"><span>'+t('detail.description')+'</span><span>'+esc(task.message)+'</span></p>':'')+'<p class="title"><span>'+t('detail.details')+'</span></p><button class="more-link" id="toggleDetails">'+(showDetails?t('action.collapse'):t('action.showMore'))+' <i class="ei '+(showDetails?'arrow-down':'arrow-right')+'"></i></button></div>'+(showDetails?'<hr class="el-divider"><div class="steps-title"><span>'+t('detail.steps')+'</span><button id="detailRefresh" aria-label="'+t('detail.refresh')+'" title="'+t('detail.refresh')+'"><i class="ei refresh"></i></button></div><div class="content-container"><ul class="el-timeline box-container"><li class="el-timeline-item box '+stateClass+'">'+renderTimelineNode(task.status,true)+'<div class="el-timeline-item__wrapper"><div class="el-timeline-item__content"><p><span>'+esc(task.start||task.created)+'</span> <span>GMT+08:00</span></p><p>'+esc(display)+'</p><ul class="el-timeline">'+logs.map(l=>'<li class="el-timeline-item '+l.level+'">'+renderTimelineNode(l.level)+'<div class="el-timeline-item__wrapper"><div class="el-timeline-item__content log-line"><span>['+esc(l.time)+'</span> <span>GMT+08:00]</span> <span>-</span> <span>'+esc(l.line)+'</span></div></div></li>').join('')+'</ul></div></div></li></ul></div>':'')+'</div>';
 const scroller=$('detailContent').querySelector('.content-container');
 if(scroller)scroller.scrollTop=scrollAction==='bottom'?scroller.scrollHeight:scrollAction==='top'?0:oldScroll;
}
function changeScene(next){scene=next;selected.clear();page=1;searchType='name';statusFilter='';$('searchInput').value='';$('searchTypeLabel').textContent=t('toolbar.gatewayName');$('searchBox').hidden=false;$('statusSelect').hidden=true;$('statusLabel').textContent=t('toolbar.all');$('gatewayPanel').classList.toggle('break-back',scene==='breakBack');$('recordsBackdrop').classList.toggle('break-back',scene==='breakBack');$('detailBackdrop').classList.toggle('break-back',scene==='breakBack');$('platformHeading').innerHTML=(scene==='dr'?t('header.platform'):t('header.failbackPlatform'))+'<span class="sort"></span>';document.querySelectorAll('[data-scene]').forEach(e=>{e.classList.toggle('active',e.dataset.scene===scene);e.setAttribute('aria-selected',e.dataset.scene===scene);});$('mainTableScroll').scrollLeft=0;draw();}
refreshStatusMenu();
$('searchType').onclick=()=>toggleMenu('searchType','searchTypeMenu');$('statusFilter').onclick=()=>toggleMenu('statusFilter','statusMenu');$('pageSizeButton').onclick=()=>toggleMenu('pageSizeButton','pageSizeMenu');
$('searchInput').oninput=()=>{page=1;selected.clear();draw();};
$('selectAll').onchange=e=>{filtered().slice((page-1)*pageSize,page*pageSize).filter(canUpgrade).forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));draw();};
$('upgradeBtn').onclick=()=>{const tasks=model.start([...selected]);selected.clear();persist();draw();if(tasks.length)toast(t('toast.created')+' ('+tasks.length+')');};
$('refreshBtn').onclick=()=>{model.tick();persist();applyStaticTranslations();refreshStatusMenu();draw();toast(t('toast.refresh'));};
$('recordsRefresh').onclick=()=>{model.tick();persist();draw();toast(t('toast.recordsRefresh'));};
$('recordsClose').onclick=()=>closeDrawer('recordsBackdrop');$('detailClose').onclick=()=>closeDrawer('detailBackdrop');
$('prevPage').onclick=()=>{page--;draw();};$('nextPage').onclick=()=>{page++;draw();};$('jumpPage').onchange=e=>{page=Math.max(1,Number(e.target.value)||1);draw();};
$('recordSize').onchange=e=>{recordSize=Number(e.target.value);recordPage=1;drawRecords();};
$('recordPrev').onclick=()=>{recordPage--;drawRecords();};$('recordNext').onclick=()=>{recordPage++;drawRecords();};$('recordJump').onchange=e=>{recordPage=Math.max(1,Number(e.target.value)||1);drawRecords();};
$('collapseSidebar').onclick=()=>{const collapsed=$('sidebar').classList.toggle('collapsed');$('collapseSidebar').setAttribute('aria-expanded',!collapsed);$('collapseSidebar').setAttribute('aria-label',collapsed?'展开侧栏':'收起侧栏');$('collapseSidebar').innerHTML='<i class="ei '+(collapsed?'arrow-right':'arrow-left')+'"></i>';};
document.addEventListener('click',async e=>{
 if(e.target.closest('#language-toggle')){e.preventDefault();toggleLanguageMenu();return;}
 const languageOption=e.target.closest('[data-language]');if(languageOption){setLanguage(languageOption.dataset.language);return;}
 if(!e.target.closest('.language-switcher'))closeLanguageMenu();
 const el=e.target.closest('button,a,th,input');
 if(!e.target.closest('.search-select,.page-size'))closeMenus();
 if(el?.matches('[data-check]')){el.checked?selected.add(el.dataset.check):selected.delete(el.dataset.check);draw();}
 if(el?.dataset.scene&&!el.disabled)changeScene(el.dataset.scene);
 if(el?.dataset.searchType){searchType=el.dataset.searchType;statusFilter='';page=1;selected.clear();$('searchInput').value='';$('statusLabel').textContent=t('toolbar.all');$('searchTypeLabel').textContent=searchType==='name'?t('toolbar.gatewayName'):t('toolbar.status');$('searchBox').hidden=searchType!=='name';$('statusSelect').hidden=searchType!=='status';closeMenus();draw();}
 if(el?.hasAttribute('data-status')){statusFilter=el.dataset.status;$('statusLabel').textContent=el.textContent;page=1;selected.clear();closeMenus();draw();}
 if(el?.dataset.pageSize){pageSize=Number(el.dataset.pageSize);page=1;$('pageSizeLabel').textContent=pageSizeText(pageSize);refreshPageSizeLabels();closeMenus();draw();}
 if(el?.dataset.page){page=Number(el.dataset.page);draw();}
 if(el?.dataset.sort){sortDirection=sortKey===el.dataset.sort?-sortDirection:1;sortKey=el.dataset.sort;document.querySelectorAll('th .sort').forEach(s=>s.classList.remove('asc','desc'));el.querySelector('.sort').classList.add(sortDirection===1?'asc':'desc');draw();}
 if(e.target.dataset.recordSort){recordDir=recordSort===e.target.dataset.recordSort?-recordDir:1;recordSort=e.target.dataset.recordSort;drawRecords();}
 if(el?.dataset.record&&!el.disabled)openRecords(el.dataset.record);
 if(el?.dataset.detail)openDetail(el.dataset.detail,el.dataset.task==='true');
 if(el?.dataset.cancel){const task=getTask(el.dataset.cancel,true);const hostId=task?.hostId||el.dataset.cancel;if(model.cancel(hostId)){persist();draw();toast(t('toast.cancelled'));}}
 if(el?.id==='toggleDetails'){showDetails=!showDetails;drawDetail();}
 if(el?.id==='detailRefresh'){model.tick();persist();draw();drawDetail('top');toast('任务详情已刷新');}
 if(el?.matches('[data-reference],.hamburger')){e.preventDefault();toast(t('toast.prototype'));}
 if(e.target===$('recordsBackdrop'))closeDrawer('recordsBackdrop');if(e.target===$('detailBackdrop'))closeDrawer('detailBackdrop');
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(detailTask)closeDrawer('detailBackdrop');else if(recordHost)closeDrawer('recordsBackdrop');else closeMenus();}
 if(e.key==='Tab'&&(detailTask||recordHost)){const drawer=$(detailTask?'detailBackdrop':'recordsBackdrop');const focusable=[...drawer.querySelectorAll('button:not(:disabled),input:not(:disabled)')].filter(e=>e.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
$('mainTableScroll').addEventListener('scroll',syncFixedColumnShadow,{passive:true});
new ResizeObserver(syncFixedColumnShadow).observe($('mainTableScroll'));
window.addEventListener('languagechange',()=>{refreshStatusMenu();draw();if(recordHost)drawRecords();if(detailTask)drawDetail();});
setInterval(()=>{if(model.tick()){persist();draw();}},500);model.tick();persist();draw();
})();
</script></body></html>
