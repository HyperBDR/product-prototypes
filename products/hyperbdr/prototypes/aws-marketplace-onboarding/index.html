  <script>// Shared brand resolver. Loaded synchronously before CSS to avoid a wrong-brand
// first frame. No cookies/localStorage: separate tabs cannot change each other.
globalThis.ProductBrand = (() => {
  const catalog = globalThis.ProductCatalog;
  const base = document.querySelector('meta[name="app-base"]')?.content || '/';
  const receiptMode = ['receipt', 'aws'].includes(document.querySelector('meta[name="app-flow"]')?.content);
  const themeProperties = {
    primary: '--color-primary',
    primaryHover: '--color-primary-hover',
    accent: '--color-accent',
    background: '--page-background',
    backgroundAlt: '--page-background-alt'
  };
  const normalize = value => typeof value === 'string' ? value.trim().toLowerCase() : '';
  const resolve = value => {
    const key = normalize(value);
    if (!key) return null;
    return Object.entries(catalog.products).find(([id, product]) =>
      [id, product.displayName, ...(product.aliases || [])].some(name => normalize(name) === key)
    )?.[0] || null;
  };
  const fromURL = () => {
    const values = new URLSearchParams(location.search).getAll('product');
    return values.length === 0 ? (receiptMode ? null : catalog.defaultProduct) : values.length === 1 ? resolve(values[0]) : null;
  };
  let currentId = fromURL();
  let error = receiptMode || currentId ? null : 'unknown_product';
  let notice = '';

  function url(path = '/') {
    const target = new URL(location.href);
    const query = new URLSearchParams();
    for (const key of ['flow', 'scenario']) {
      if (target.searchParams.has(key)) query.set(key, target.searchParams.get(key));
    }
    if (currentId) query.set('product', currentId);
    if (path !== '/') query.set('page', path);
    target.search = query.toString(); target.hash = '';
    return target.href;
  }
  function applyHead() {
    const product = catalog.products[currentId];
    const root = document.documentElement;
    root.dataset.product = currentId || '';
    // Defaults are neutral when product is unknown. Do not retain an old theme.
    for (const [key, property] of Object.entries(themeProperties)) {
      if (product?.theme?.[key]) root.style.setProperty(property, product.theme[key]);
      else root.style.removeProperty(property);
    }
    // Optional colors derive from primary in CSS, not from another product.
    document.title = product ? `${globalThis.I18n.t("Connect AWS subscription")} · ${product.displayName}` : globalThis.I18n.t("Connect AWS subscription");
    const favicon = document.querySelector('link[rel="icon"]');
    if (favicon) {
      favicon.href = product?.assets?.icon || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTIiIGZpbGw9IiMxNDIzM2UiLz48cGF0aCBkPSJNMjQgOCAzOSAxNHYxMGMwIDgtOCAxNC0xNSAxOEMxNyAzOCA5IDMyIDkgMjRWMTRaIiBmaWxsPSIjNjdjY2RiIi8+PHBhdGggZD0ibTI0IDggMTUgNnYxMGMwIDgtOCAxNC0xNSAxOFoiIGZpbGw9IiM0MDdmYjciLz48cGF0aCBkPSJtMTcgMjQgNSA1IDEwLTExIiBmaWxsPSJub25lIiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjMiLz48L3N2Zz4K";
      favicon.removeAttribute('type');
    }
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = product?.theme?.background || '#101a30';
  }
  function applyShell() {
    const product = catalog.products[currentId];
    document.querySelectorAll('[data-product-name]').forEach(node => {
      node.textContent = product?.displayName || globalThis.I18n.t("Subscription onboarding");
    });
    document.querySelectorAll('[data-product-mark]').forEach(node => {
      node.hidden = !product;
      node.src = product?.assets?.icon || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTIiIGZpbGw9IiMxNDIzM2UiLz48cGF0aCBkPSJNMjQgOCAzOSAxNHYxMGMwIDgtOCAxNC0xNSAxOEMxNyAzOCA5IDMyIDkgMjRWMTRaIiBmaWxsPSIjNjdjY2RiIi8+PHBhdGggZD0ibTI0IDggMTUgNnYxMGMwIDgtOCAxNC0xNSAxOFoiIGZpbGw9IiM0MDdmYjciLz48cGF0aCBkPSJtMTcgMjQgNSA1IDEwLTExIiBmaWxsPSJub25lIiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjMiLz48L3N2Zz4K";
    });
    const brand = document.querySelector('.brand');
    if (brand) {
      brand.href = url('/');
      brand.setAttribute('aria-label', product ? `${product.displayName}${globalThis.I18n.t(" subscription onboarding home")}` : globalThis.I18n.t("Subscription onboarding home"));
    }
    globalThis.I18n?.applyShell();
  }
  function syncLocation() {
    if (currentId) {
      const current = new URL(location.href);
      current.searchParams.set('product', currentId);
      try { history.replaceState(history.state, '', current.href); } catch { /* Restricted file:// history. */ }
    }
  }
  function sync(state) {
    if (state?.tokenReceiptOnly || state?.genericMarketplace) {
      // The callback hint selects presentation only; it never authenticates a
      // purchase. A trusted seller-side mapping still overrides a conflicting
      // hint. No implicit default brand is introduced on a generic entry.
      const requestedId = new URLSearchParams(location.search).has('product') ? fromURL() : null;
      const serverId = state.genericMarketplace && state.context?.verification?.resolved
        ? resolve(state.context?.purchase?.productId) : null;
      currentId = serverId || requestedId || resolve(state.context?.displayProduct);
      error = null;
      notice = serverId && requestedId && requestedId !== serverId
        ? `${globalThis.I18n.t("This subscription is for ")}${catalog.products[serverId].displayName}${globalThis.I18n.t(". The page has switched to that product.")}`
        : '';
      applyHead();
      applyShell();
      syncLocation();
      return;
    }
    const requestedId = fromURL();
    // This field must be produced by the backend after resolving the purchase.
    // Never infer it from a Marketplace code or send URL product as entitlement.
    const purchase = state?.context?.purchase;
    const authoritative = purchase?.productId ?? purchase?.product;
    const hasAuthoritative = authoritative !== undefined && authoritative !== null;
    const serverId = hasAuthoritative ? resolve(authoritative) : null;
    currentId = hasAuthoritative ? serverId : requestedId;
    error = currentId ? null : hasAuthoritative ? 'unsupported_subscription_product' : 'unknown_product';
    notice = serverId && requestedId !== serverId
      ? `${globalThis.I18n.t("This subscription is for ")}${catalog.products[serverId].displayName}${globalThis.I18n.t(". The page has switched to that product.")}`
      : '';
    applyHead();
    applyShell();
    // A reload, header link or subsequent route must retain the resolved brand.
    // Keep other parameters untouched here; never copy them to new routes.
    syncLocation();
  }
  applyHead();
  return Object.freeze({
    get product() { return catalog.products[currentId] || null; },
    get id() { return currentId; },
    get error() { return error; },
    get notice() { return notice; },
    resolve, url, sync, applyShell
  });
})();
</script>

:root {
  color-scheme: light;
  --ink: #1b2941;
  --line: #e8edf3;
  --color-primary: #526780;
  --color-primary-hover: color-mix(in srgb, var(--color-primary) 82%, black);
  --color-accent: var(--color-primary);
  --color-primary-soft: color-mix(in srgb, var(--color-primary) 7%, white);
  --color-primary-tint: color-mix(in srgb, var(--color-primary) 3%, white);
  --color-primary-border: color-mix(in srgb, var(--color-primary) 22%, white);
  --color-primary-ink: color-mix(in srgb, var(--color-primary) 80%, #1b2941);
  --color-primary-muted: color-mix(in srgb, var(--color-primary) 65%, #788397);
  --color-focus: color-mix(in srgb, var(--color-primary) 65%, white);
  --color-on-dark: color-mix(in srgb, var(--color-accent) 50%, white);
  --color-on-dark-muted: color-mix(in srgb, var(--color-accent) 35%, #94a7bd);
  --page-background: #101a30;
  --page-background-alt: #18273d;
  --green: #159d7e;
  font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  font-synthesis: none;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-width: 360px; min-height: 100vh; min-height: 100dvh; color: var(--ink);
  display: flex; flex-direction: column;
  background: radial-gradient(ellipse at 5% 0%, color-mix(in srgb, var(--color-primary) 28%, transparent), transparent 48%), radial-gradient(ellipse at 95% 100%, color-mix(in srgb, var(--color-accent) 14%, transparent), transparent 50%), linear-gradient(130deg, var(--page-background) 15%, var(--page-background) 65%, var(--page-background-alt));
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(145deg, transparent 40%, color-mix(in srgb, var(--color-accent) 7%, transparent)); opacity: .6;
}
button, input, select { font: inherit; }

function refreshLanguage() {
  const fields = () => [...document.querySelectorAll('input, select, textarea')]
    .filter(field => field.name);
  const fieldKey = field => `${field.form?.id || 'page'}:${field.name}`;
  const focusedKey = document.activeElement?.name ? fieldKey(document.activeElement) : null;
  const snapshot = fields().map(field => ({
    key: fieldKey(field), value: field.value, checked: field.checked,
    disabled: field.disabled, type: field.type,
    selectionStart: field.selectionStart, selectionEnd: field.selectionEnd
  }));
  const validation = [...document.querySelectorAll('.form-error')].map(box => ({
    form: box.closest?.('form')?.id, text: box.textContent, hidden: box.hidden
  }));
  const disclosures = [...document.querySelectorAll('#app details')].map(node => node.open);
  const scrollSelector = '#app .panel-body, #overlay .modal-body';
  const contentScroll = [...document.querySelectorAll(scrollSelector)]
    .map(node => ({ top: node.scrollTop, left: node.scrollLeft }));
  const dialogAction = $('.modal')?.open ? activeDialogAction : null;
  const opener = lastFocused;
  const scroll = { x: window.scrollX || 0, y: window.scrollY || 0 };
  brand.sync(state);
  if (bootErrorMessage) renderBootError(bootErrorMessage);
  else render();
  if (dialogAction) {
    action(dialogAction).catch(error => toast(error.message));
    lastFocused = opener;
  }
  const saved = new Map();
  for (const field of snapshot) {
    if (!saved.has(field.key)) saved.set(field.key, []);
    saved.get(field.key).push(field);
  }
  for (const field of fields()) {
    const previous = saved.get(fieldKey(field))?.shift();
    if (!previous) continue;
    field.value = previous.value;
    field.checked = previous.checked;
    field.disabled = previous.disabled;
    if (previous.type === 'text' && field.type === 'password') {
      field.type = 'text';
      const toggle = field.parentElement?.querySelector('[data-action="password"]');
      toggle?.setAttribute('aria-pressed', 'true');
      toggle?.setAttribute('aria-label', t('Hide password'));
    }
    if (fieldKey(field) === focusedKey) {
      field.focus();
      if (previous.selectionStart !== null && previous.selectionStart !== undefined) {
        try { field.setSelectionRange(previous.selectionStart, previous.selectionEnd); } catch { /* Email/select controls do not support selection ranges. */ }
      }
    }
  }
  for (const box of document.querySelectorAll('.form-error')) {
    const previous = validation.find(item => item.form && item.form === box.closest?.('form')?.id);
    if (previous) { box.textContent = t(previous.text); box.hidden = previous.hidden; }
  }
  document.querySelectorAll('#app details').forEach((node, index) => { node.open = disclosures[index] || false; });
  document.querySelectorAll(scrollSelector).forEach((node, index) => {
    if (contentScroll[index]) {
      node.scrollTop = contentScroll[index].top;
      node.scrollLeft = contentScroll[index].left;
    }
  });
  if (lastToastMessage) $('#toast').textContent = t(lastToastMessage);
  window.scrollTo?.(scroll.x, scroll.y);
}
I18n.subscribe(refreshLanguage);

function renderBootError(message) {
  I18n.applyShell();
  $('#app').setAttribute('aria-busy', 'false');
  $('#app').innerHTML = `<div class="boot-error">${icon('alert')}<h2>${t("Unable to restore onboarding")}</h2><p>${escapeHTML(t(message))}</p><a class="primary" href="${pageURL('/')}">${t("Back to home")}</a></div>`;
}
async function boot() {
  try {
    updateState(await api('/api/state'));
    verifyStep = Boolean(state.registration);
    render();
    if (state.awsDirectFlow) await resolvePurchase().catch(error => toast(error.message));
  } catch (error) {
    bootErrorMessage = error.message;
    renderBootError(bootErrorMessage);
  }
}
boot();

</script>
</body>
